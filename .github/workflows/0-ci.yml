# Pipeline: merge to main → 0-ci → 1-build-push (Docker Hub). Redeploy in Rancher manually.
name: auth-engine · Lint and Typecheck

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  api:
    name: API lint and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff check
        run: |
          if ! uv run ruff check src; then
            echo "::error::Ruff lint failed. Run: uv run ruff check src --fix"
            exit 1
          fi

      - name: Ruff format
        run: |
          if ! uv run ruff format --check --diff src; then
            echo ""
            echo "::error::Code is not formatted."
            echo "Fix locally with:"
            echo "  cd apps/api"
            echo "  uv sync --extra dev"
            echo "  uv run ruff format src"
            echo "Then commit the formatted files."
            exit 1
          fi

      - name: Mypy
        run: uv run mypy src
        env:
          PYTHONPATH: src

  dashboard:
    name: Dashboard lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - run: npm ci

      - run: npm run lint

      - name: Build (production)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.authengine.org/api/v1
          NEXT_PUBLIC_APP_URL: https://app.authengine.org

