# Runs after CI succeeds on main (workflow_run). Pushes API + dashboard :latest to Docker Hub.
name: auth-engine · Build and Push Images

on:
  workflow_run:
    workflows: ["auth-engine · CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref_type:
        description: Build source type
        required: true
        type: choice
        options:
          - branch
          - tag
        default: branch
      git_ref:
        description: Branch or tag name (e.g. main, v1.0.0)
        required: true
        type: string
        default: main
      docker_tag:
        description: Tag for both images (e.g. 1.0.0, latest)
        required: true
        type: string
      api_image:
        description: API image name (e.g. qniranjan01/authengine). Leave blank to use DOCKERHUB_USERNAME/authengine
        required: false
        type: string
        default: ""
      dashboard_image:
        description: Dashboard image name (e.g. qniranjan01/authengine-dashboard). Leave blank to use DOCKERHUB_USERNAME/authengine-dashboard
        required: false
        type: string
        default: ""

env:
  REGISTRY: docker.io

jobs:
  api:
    name: API image
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.full }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Resolve image name and tag
        id: image
        run: |
          if [ -n "${{ inputs.api_image }}" ]; then
            IMAGE="${{ inputs.api_image }}"
          else
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/authengine"
          fi

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ inputs.docker_tag }}"
          else
            TAG="latest"
          fi

          echo "name=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "full=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.git_ref || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: apps/api/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.full }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          platforms: linux/amd64,linux/arm64

  dashboard:
    name: Dashboard image
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.full }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Resolve image name and tag
        id: image
        run: |
          if [ -n "${{ inputs.dashboard_image }}" ]; then
            IMAGE="${{ inputs.dashboard_image }}"
          else
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/authengine-dashboard"
          fi

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ inputs.docker_tag }}"
          else
            TAG="latest"
          fi

          echo "name=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "full=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.git_ref || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push dashboard image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./apps/dashboard
          dockerfile: Dockerfile
          push: true
          tags: ${{ steps.image.outputs.full }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
          platforms: linux/amd64,linux/arm64
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL != '' && vars.NEXT_PUBLIC_API_URL || 'https://api.authengine.org/api/v1' }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL != '' && vars.NEXT_PUBLIC_APP_URL || 'https://app.authengine.org' }}

  summary:
    name: Summary
    needs: [api, dashboard]
    if: >
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        run: |
          echo "## Images built & pushed to Docker Hub" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "**Source:** \`${{ inputs.ref_type }}:${{ inputs.git_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Source:** \`main@${{ github.event.workflow_run.head_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | Digest |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${{ needs.api.outputs.image }}\` | \`${{ needs.api.outputs.digest }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${{ needs.dashboard.outputs.image }}\` | \`${{ needs.dashboard.outputs.digest }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Next step — redeploy in Rancher" >> "$GITHUB_STEP_SUMMARY"
          echo "Redeploy **api** and **dashboard** (or \`kubectl rollout restart deployment/api deployment/dashboard -n authengine\`) to pick up \`:latest\`." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "After a new API release, run migrations: \`auth-engine migrate\` in the api pod (see [deployment guide](https://docs.authengine.org/deployment/))." >> "$GITHUB_STEP_SUMMARY"
