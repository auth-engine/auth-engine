name: Feature request
description: Suggest an idea or improvement for this open-source project
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want solved. Feature requests help shape the AuthEngine roadmap.

        Search [existing issues](https://github.com/auth-engine/auth-engine/issues) first. Large ideas belong in an issue before a PR — see [Contributing](https://docs.authengine.org/contributing/).

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - apps/api
        - apps/dashboard
        - data (seed JSON)
        - docker-compose.yml (local databases / stack)
        - deployment (Helm / Terraform / scripts)
        - docs
        - CI / GitHub Actions
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this solve? Who benefits?
      placeholder: Tenant admins cannot export audit logs for compliance reviews...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work?
      placeholder: Add GET /api/v1/tenants/{id}/audit-logs/export that returns CSV for a date range...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about (including “do nothing”)

  - type: dropdown
    id: contribution
    attributes:
      label: Are you willing to contribute a PR?
      options:
        - Yes, I can open a PR
        - Maybe, I need guidance first
        - No, suggestion only
    validations:
      required: true
