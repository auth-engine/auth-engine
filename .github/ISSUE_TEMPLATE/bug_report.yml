name: Bug report
description: Something is broken or not working as documented
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug in this **open-source** project.

        Please search [existing issues](https://github.com/auth-engine/auth-engine/issues) first.
        Security issues: [security policy](https://docs.authengine.org/security-policy/) — do not file them here.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - apps/api
        - apps/dashboard
        - data (seed JSON)
        - docker-compose.yml (local databases / stack)
        - deployment (Helm / Terraform / scripts)
        - docs
        - CI / GitHub Actions
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the unexpected behavior
      placeholder: After a successful password login, POST /api/v1/auth/login returns 500 while creating the Redis session...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps. Prefer host API + Compose databases (see Quick Start).
      placeholder: |
        1. docker compose up -d postgres mongo redis
        2. cd apps/api && uv run auth-engine run --reload
        3. POST /api/v1/auth/login with the seeded super admin
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: Login returns 200 with access_token and a Redis session is created.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Docker, Python/Node, how you ran the stack (host-dev vs full Compose), image or git ref
      placeholder: |
        OS: Ubuntu 24.04
        Docker: 27.x
        Run: host API (uv) + compose postgres/mongo/redis
        Git: main @ abc1234
        Browser: Firefox 130 (if dashboard)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Redact secrets, tokens, and passwords. Paste API traceback or browser console output.

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have redacted secrets and personal data from this report
          required: true
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I followed [Quick Start](https://docs.authengine.org/quick-start/) (or describe why not)
          required: false
