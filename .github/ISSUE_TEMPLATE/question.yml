name: Question
description: Ask for help using or integrating AuthEngine
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        AuthEngine is **open source**. Check the docs first:

        - [Quick Start](https://docs.authengine.org/quick-start/) — local development
        - [Architecture](https://docs.authengine.org/architecture/)
        - [OAuth2 / OIDC](https://docs.authengine.org/oauth2-oidc-guides/)
        - [API Reference](https://docs.authengine.org/api-reference/)

        Design discussion belongs in [Discussions](https://github.com/auth-engine/auth-engine/discussions).
        Vulnerabilities: [security policy](https://docs.authengine.org/security-policy/).

  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Local development (host API + Compose databases)
        - Full Docker Compose stack
        - Self-hosted deployment (Helm / VM)
        - OAuth2 / OIDC integration
        - Multi-tenancy / RBAC
        - API usage
        - Dashboard
        - Other
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Your question
      placeholder: How do I register an OIDC client for a third-party app?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: What you already tried
      description: Docs you read, commands you ran, errors you saw. Redact secrets.
      placeholder: |
        Followed Quick Start path A.
        uv run auth-engine migrate && seed succeeded.
        Login returns 500; Redis logs show WRONGPASS...
    validations:
      required: false
