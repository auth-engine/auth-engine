repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: bash -c 'cd apps/api && uv run ruff check src'
        language: system
        pass_filenames: false
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd apps/api && uv run ruff format src'
        language: system
        pass_filenames: false
        types: [python]

      - id: mypy
        name: mypy
        entry: bash -c 'cd apps/api && PYTHONPATH=src uv run mypy src'
        language: system
        pass_filenames: false
        types: [python]
